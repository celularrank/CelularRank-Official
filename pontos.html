<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pontos - CelularRank</title>

    <meta
        name="description"
        content="Ranking de pontos e desempenho dos dispositivos no CelularRank."
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header class="site-header">

    <div class="container header-content">

        <a href="index.html" class="logo">
            <span>CELULAR</span><strong>RANK</strong>
        </a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="main-nav" id="mainNav">

            <a href="index.html">
                Início
            </a>

            <a href="celulares.html">
                Celulares
            </a>

            <a href="pcs.html">
                PCs
            </a>

            <a href="pontos.html" class="active">
                Pontos
            </a>

        </nav>

    </div>

</header>


<main>

<section class="catalog-page">

<div class="container">

    <div class="page-head">

        <div>

            <span class="eyebrow">
                CELULARRANK SCORE
            </span>

            <h1>
                Pontuação
            </h1>

            <p>
                Ranking baseado nos critérios do CelularRank.
            </p>

        </div>

    </div>


    <div class="info-box">

        <strong>
            ℹ️ Como funciona?
        </strong>

        <p>
            A pontuação abaixo é uma métrica própria e estimada
            do CelularRank. Ela não representa uma pontuação oficial
            de outros benchmarks.
        </p>

    </div>


    <div class="points-controls">

        <input
            id="pointsSearch"
            class="input"
            type="search"
            placeholder="🔎 Pesquisar dispositivo..."
        >


        <select id="pointsType" class="input">

            <option value="todos">
                Celulares e PCs
            </option>

            <option value="celulares">
                Apenas celulares
            </option>

            <option value="pcs">
                Apenas PCs
            </option>

        </select>


        <select id="pointsSort" class="input">

            <option value="total">
                Maior pontuação
            </option>

            <option value="desempenho">
                Desempenho
            </option>

            <option value="jogos">
                Jogos
            </option>

            <option value="qualidade">
                Qualidade
            </option>

        </select>

    </div>


    <div id="pointsList" class="points-list"></div>

</div>

</section>

</main>


<script src="dados.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const phones =
            Array.isArray(window.celulares)
                ? window.celulares
                : [];


        const pcs =
            Array.isArray(window.pcs)
                ? window.pcs
                : [];


        const list =
            document.getElementById(
                "pointsList"
            );


        const search =
            document.getElementById(
                "pointsSearch"
            );


        const type =
            document.getElementById(
                "pointsType"
            );


        const sort =
            document.getElementById(
                "pointsSort"
            );


        function calculate(item) {

            const desempenho =
                Number(item.desempenho || 0);

            const jogos =
                Number(item.jogos || 0);

            const qualidade =
                Number(item.qualidade || 0);


            const total =
                Math.round(
                    (
                        desempenho * 3000 +
                        jogos * 3000 +
                        qualidade * 2000 +
                        qualidade * 2000
                    )
                );


            return {
                cpu: desempenho,
                gpu: jogos,
                mem: qualidade,
                ux: qualidade,
                total
            };

        }


        function render() {

            const term =
                search.value
                    .toLowerCase()
                    .trim();


            let data = [];


            if (
                type.value === "todos" ||
                type.value === "celulares"
            ) {

                phones.forEach(item => {

                    data.push({
                        ...item,
                        categoria: "Celular"
                    });

                });

            }


            if (
                type.value === "todos" ||
                type.value === "pcs"
            ) {

                pcs.forEach(item => {

                    data.push({
                        ...item,
                        categoria: "PC"
                    });

                });

            }


            data = data.filter(item => {

                const text = `
                    ${item.nome || ""}
                    ${item.marca || ""}
                    ${item.processador || ""}
                `.toLowerCase();

                return !term ||
                    text.includes(term);

            });


            data.forEach(item => {

                item.pontos =
                    calculate(item);

            });


            if (
                sort.value === "desempenho"
            ) {

                data.sort(
                    (a, b) =>
                        b.pontos.cpu -
                        a.pontos.cpu
                );

            } else if (
                sort.value === "jogos"
            ) {

                data.sort(
                    (a, b) =>
                        b.pontos.gpu -
                        a.pontos.gpu
                );

            } else if (
                sort.value === "qualidade"
            ) {

                data.sort(
                    (a, b) =>
                        b.pontos.ux -
                        a.pontos.ux
                );

            } else {

                data.sort(
                    (a, b) =>
                        b.pontos.total -
                        a.pontos.total
                );

            }


            list.innerHTML = "";


            data.forEach(
                (item, index) => {

                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "points-card";


                    card.innerHTML = `

                        <div class="rank-number">
                            #${index + 1}
                        </div>

                        <div class="points-main">

                            <div class="points-title">

                                <span class="pill">
                                    ${item.categoria}
                                </span>

                                <h2>
                                    ${item.nome}
                                </h2>

                                <p>
                                    ${item.processador || ""}
                                </p>

                            </div>


                            <div class="points-total">

                                <strong>
                                    ${item.pontos.total.toLocaleString("pt-BR")}
                                </strong>

                                <span>
                                    PONTOS
                                </span>

                            </div>

                        </div>


                        <div class="points-bars">

                            <div class="point-bar">

                                <div>
                                    <span>CPU</span>
                                    <strong>
                                        ${item.pontos.cpu}
                                    </strong>
                                </div>

                                <div class="bar">
                                    <i style="width:${item.pontos.cpu}%"></i>
                                </div>

                            </div>


                            <div class="point-bar">

                                <div>
                                    <span>GPU</span>
                                    <strong>
                                        ${item.pontos.gpu}
                                    </strong>
                                </div>

                                <div class="bar">
                                    <i style="width:${item.pontos.gpu}%"></i>
                                </div>

                            </div>


                            <div class="point-bar">

                                <div>
                                    <span>MEM</span>
                                    <strong>
                                        ${item.pontos.mem}
                                    </strong>
                                </div>

                                <div class="bar">
                                    <i style="width:${item.pontos.mem}%"></i>
                                </div>

                            </div>


                            <div class="point-bar">

                                <div>
                                    <span>UX</span>
                                    <strong>
                                        ${item.pontos.ux}
                                    </strong>
                                </div>

                                <div class="bar">
                                    <i style="width:${item.pontos.ux}%"></i>
                                </div>

                            </div>

                        </div>

                    `;


                    list.appendChild(card);

                }
            );

        }


        search.addEventListener(
            "input",
            render
        );


        type.addEventListener(
            "change",
            render
        );


        sort.addEventListener(
            "change",
            render
        );


        render();

    }
);

</script>

<script src="script.js"></script>

</body>

</html>
