/* INFORMAÇÕES DO PC */

    grid-template-columns: repeat(4, 1fr);

    }

/* =====================================================
   BUSCAR CELULARES E PCS
===================================================== */

function obterProdutos() {

    let listaCelulares = [];

    let listaPCs = [];


    /*
       CELULARES
    */

    if (
        typeof window.celulares !== "undefined" &&
        Array.isArray(window.celulares)
    ) {

        listaCelulares =
            window.celulares;

    }


    /*
       PCs

       Primeiro tenta pegar do dados.js.
       Se não existir, usa o fallback.
    */

    if (
        typeof window.pcs !== "undefined" &&
        Array.isArray(window.pcs) &&
        window.pcs.length > 0
    ) {

        listaPCs =
            window.pcs;

    } else {

        listaPCs =
            pcsFallback;

    }


    return [

        ...listaCelulares.map(pc => ({
            ...pc,
            tipo: "celular"
        })),

        ...listaPCs.map(pc => ({
            ...pc,
            tipo: "pc"
        }))

    ];

}


/* =====================================================
   CALCULAR PONTOS
===================================================== */

function calcularPontos(produto) {

    const desempenho =
        Number(produto.desempenho) || 0;

    const jogos =
        Number(produto.jogos) || 0;

    const qualidade =
        Number(produto.qualidade) || 0;


    /*
       CPU
       300.000 pontos
    */

    const CPU =
        Math.round(
            (desempenho / 100) *
            300000
        );


    /*
       GPU
       300.000 pontos
    */

    const GPU =
        Math.round(
            (jogos / 100) *
            300000
        );


    /*
       MEM
       200.000 pontos

       16 GB = máximo
    */

    const RAM =
        parseInt(
            String(produto.ram || "0")
                .replace(/[^\d]/g, "")
        ) || 0;


    const MEM =
        Math.round(
            Math.min(RAM, 16) /
            16 *
            200000
        );


    /*
       UX
       200.000 pontos
    */

    const UX =
        Math.round(
            (
                desempenho +
                qualidade
            ) / 2 / 100 *
            200000
        );


    /*
       TOTAL
    */

    const total =
        Math.min(
            1000000,
            CPU +
            GPU +
            MEM +
            UX
        );


    return {

        CPU,
        GPU,
        MEM,
        UX,
        total

    };

}


/* =====================================================
   FILTRO
===================================================== */

let filtroAtual = "todos";


function mostrar(filtro, botao) {

    filtroAtual =
        filtro;


    document
        .querySelectorAll(".filtros button")
        .forEach(button => {

            button.classList.remove("ativo");

        });


    botao.classList.add("ativo");


    renderizar();

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizar() {

    let produtos =
        obterProdutos();


    /*
       Filtro
    */

    if (filtroAtual !== "todos") {

        produtos =
            produtos.filter(
                produto =>
                    produto.tipo ===
                    filtroAtual
            );

    }


    /*
       Calcula pontos
    */

    produtos =
        produtos.map(produto => ({

            ...produto,

            pontos:
                calcularPontos(produto)

        }));


    /*
       Ordena do maior para o menor
    */

    produtos.sort(
        (a, b) =>
            b.pontos.total -
            a.pontos.total
    );


    const lista =
        document.getElementById(
            "lista-pontos"
        );


    /*
       Nenhum
    */

    if (!produtos.length) {

        lista.innerHTML = `

            <div class="erro">

                <h3>
                    Nenhum dispositivo encontrado.
                </h3>

                <p style="margin-top:8px;">
                    Verifique o arquivo dados.js.
                </p>

            </div>

        `;

        return;

    }


    /*
       Cards
    */

    lista.innerHTML =
        produtos.map(
            (produto, index) => {

                const p =
                    produto.pontos;


                return `

                <article class="produto">

                    <div class="produto-topo">

                        <div>

                            <h2>

                                ${index + 1}º —
                                ${produto.nome}

                            </h2>

                            <div class="categoria">

                                ${produto.marca || ""}

                                •

                                ${produto.categoria || ""}

                            </div>

                        </div>


                        <div class="total">

                            💠
                            ${p.total.toLocaleString("pt-BR")}

                        </div>

                    </div>


                    <div class="pontos-grid">

                        <div class="ponto">

                            <strong>
                                🧠 CPU
                            </strong>

                            <span>
                                ${p.CPU.toLocaleString("pt-BR")}
                            </span>

                        </div>


                        <div class="ponto">

                            <strong>
                                🎮 GPU
                            </strong>

                            <span>
                                ${p.GPU.toLocaleString("pt-BR")}
                            </span>

                        </div>


                        <div class="ponto">

                            <strong>
                                💾 MEM
                            </strong>

                            <span>
                                ${p.MEM.toLocaleString("pt-BR")}
                            </span>

                        </div>


                        <div class="ponto">

                            <strong>
                                📱 UX
                            </strong>

                            <span>
                                ${p.UX.toLocaleString("pt-BR")}
                            </span>

                        </div>

                    </div>


                    <div class="informacoes">

                        <div class="info">

                            <strong>
                                ⚙️ Processador
                            </strong>

                            <br>

                            ${produto.processador || "Não informado"}

                        </div>


                        <div class="info">

                            <strong>
                                💾 RAM
                            </strong>

                            <br>

                            ${produto.ram || "Não informado"}

                        </div>


                        <div class="info">

                            <strong>
                                💿 Armazenamento
                            </strong>

                            <br>

                            ${produto.armazenamento || "Não informado"}

                        </div>


                        <div class="info">

                            <strong>
                                🎮 Vídeo
                            </strong>

                            <br>

                            ${produto.video || "Não informado"}

                        </div>

                    </div>

                </article>

                `;

            }
        )
        .join("");

}
