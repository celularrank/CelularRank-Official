<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CelularRank — Pontos</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #071a3d;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 18px 6%;
            background: #061530;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #35a9ff;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        .voltar {
            display: inline-block;
            color: #58b7ff;
            text-decoration: none;
            margin-bottom: 25px;
            font-size: 18px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .descricao {
            text-align: center;
            color: #b9c7dd;
            margin-bottom: 35px;
            font-size: 17px;
        }

        /* FILTROS */

        .filtros {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
        }

        .filtros button {
            border: 1px solid #1d5a9e;
            background: #0b2552;
            color: white;
            padding: 11px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .filtros button:hover {
            border-color: #35a9ff;
        }

        .filtros button.ativo {
            background: #35a9ff;
            border-color: #35a9ff;
        }

        /* LISTA */

        #lista-pontos {
            display: grid;
            gap: 18px;
        }

        .produto {
            background: #0b2552;
            border: 1px solid rgba(53,169,255,0.25);
            border-radius: 20px;
            padding: 22px;
        }

        .produto-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .produto h2 {
            font-size: 21px;
        }

        .total {
            color: #35a9ff;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .categoria {
            color: #8294b2;
            margin-top: 5px;
            font-size: 13px;
        }

        .pontos-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .ponto {
            background: #071a3d;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
        }

        .ponto strong {
            display: block;
            font-size: 13px;
            color: #b9c7dd;
            margin-bottom: 6px;
        }

        .ponto span {
            font-size: 17px;
            font-weight: bold;
        }

        /* INFORMAÇÕES EXTRAS */

        .info-extra {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .info {
            background: rgba(7,26,61,0.65);
            border-radius: 9px;
            padding: 9px;
            color: #b9c7dd;
            font-size: 12px;
        }

        .info strong {
            color: white;
        }

        /* MENSAGEM */

        .mensagem {
            text-align: center;
            color: #b9c7dd;
            padding: 30px;
        }

        .erro {
            background: #3b1520;
            border: 1px solid #8f3045;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: #ffd5dc;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            h1 {
                font-size: 34px;
            }

            .produto-topo {
                align-items: flex-start;
                flex-direction: column;
            }

            .total {
                font-size: 20px;
            }

            .pontos-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .info-extra {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 420px) {

            .container {
                padding: 30px 14px;
            }

            .produto {
                padding: 17px;
            }

            .pontos-grid {
                gap: 7px;
            }

            .ponto span {
                font-size: 15px;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="logo">
        Celular<span>Rank</span>
    </div>

</header>


<main class="container">

    <a href="index.html" class="voltar">
        ← Voltar
    </a>

    <h1>💠 Pontos</h1>

    <p class="descricao">
        Ranking de pontuação dos dispositivos do CelularRank.
    </p>


    <!-- FILTROS -->

    <div class="filtros">

        <button
            class="ativo"
            onclick="mostrar('todos', this)"
        >
            Todos
        </button>

        <button
            onclick="mostrar('celular', this)"
        >
            📱 Celulares
        </button>

        <button
            onclick="mostrar('pc', this)"
        >
            💻 PCs
        </button>

    </div>


    <!-- LISTA -->

    <div id="lista-pontos">

        <div class="mensagem">
            Carregando dispositivos...
        </div>

    </div>

</main>


<!--
    IMPORTANTE:
    O ?v=20260913 força o navegador a buscar
    uma versão nova do dados.js e evita cache antigo.
-->

<script src="./dados.js?v=20260913"></script>


<script>

/* =========================================================
   CELULARRANK — SISTEMA DE PONTOS
========================================================= */


/*
    Pega diretamente as constantes do dados.js.

    Isso evita o problema que estava acontecendo
    com window.celulares / window.pcs.
*/

function obterProdutos() {

    let celularesLista = [];

    let pcsLista = [];


    /*
        CELULARES
    */

    if (
        typeof celulares !== "undefined" &&
        Array.isArray(celulares)
    ) {

        celularesLista = celulares;

    }


    /*
        PCS
    */

    if (
        typeof pcs !== "undefined" &&
        Array.isArray(pcs)
    ) {

        pcsLista = pcs;

    }


    /*
        Junta tudo
    */

    return [

        ...celularesLista.map(produto => ({

            ...produto,

            tipo: "celular"

        })),

        ...pcsLista.map(produto => ({

            ...produto,

            tipo: "pc"

        }))

    ];

}


/* =========================================================
   CÁLCULO DOS PONTOS
========================================================= */

function calcularPontos(produto) {

    /*
        Notas do catálogo:
        0 até 100
    */

    const desempenho =
        Number(produto.desempenho) || 0;

    const jogos =
        Number(produto.jogos) || 0;

    const qualidade =
        Number(produto.qualidade) || 0;


    /*
        TRABALHO

        Se existir uma nota específica de trabalho,
        usa ela.

        Caso contrário usa qualidade.
    */

    const trabalho =
        Number(produto.trabalho) ||
        qualidade;


    /*
        =========================
        CPU — 300.000 pontos
        =========================
    */

    const CPU =
        Math.round(
            (desempenho / 100) * 300000
        );


    /*
        =========================
        GPU — 300.000 pontos
        =========================
    */

    const GPU =
        Math.round(
            (jogos / 100) * 300000
        );


    /*
        =========================
        MEM — 200.000 pontos
        =========================

        Considera RAM.

        16 GB ou mais = 200.000
    */

    let RAM = parseInt(
        String(produto.ram || "0")
            .replace(/[^\d]/g, "")
    ) || 0;


    let MEM =
        Math.round(
            Math.min(RAM, 16) / 16 * 200000
        );


    /*
        =========================
        UX — 200.000 pontos
        =========================
    */

    const mediaUX =
        (
            desempenho +
            qualidade +
            trabalho
        ) / 3;


    const UX =
        Math.round(
            (mediaUX / 100) * 200000
        );


    /*
        =========================
        TOTAL — 1.000.000
        =========================
    */

    const total =
        Math.min(
            1000000,
            CPU +
            GPU +
            MEM +
            UX
        );


    return {

        CPU,
        GPU,
        MEM,
        UX,
        total

    };

}


/* =========================================================
   FILTRO ATUAL
========================================================= */

let filtroAtual = "todos";


/* =========================================================
   MOSTRAR FILTRO
========================================================= */

function mostrar(filtro, botao) {

    filtroAtual = filtro;


    document
        .querySelectorAll(".filtros button")
        .forEach(button => {

            button.classList.remove("ativo");

        });


    botao.classList.add("ativo");


    renderizar();

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar() {

    let produtos = obterProdutos();


    /*
        Filtro
    */

    if (filtroAtual !== "todos") {

        produtos =
            produtos.filter(
                produto =>
                    produto.tipo === filtroAtual
            );

    }


    /*
        Calcula os pontos
    */

    produtos =
        produtos.map(produto => ({

            ...produto,

            pontos:
                calcularPontos(produto)

        }));


    /*
        Maior pontuação primeiro
    */

    produtos.sort(
        (a, b) =>
            b.pontos.total -
            a.pontos.total
    );


    const lista =
        document.getElementById(
            "lista-pontos"
        );


    /*
        Nenhum produto
    */

    if (!produtos.length) {

        lista.innerHTML = `

            <div class="erro">

                <h3>Nenhum dispositivo encontrado.</h3>

                <p style="margin-top:8px;">
                    Verifique se o arquivo
                    <strong>dados.js</strong>
                    possui os celulares e PCs.
                </p>

            </div>

        `;

        return;

    }


    /*
        Cria os cards
    */

    lista.innerHTML =
        produtos.map(
            (produto, index) => {

                const p =
                    produto.pontos;


                const camera =
                    produto.camera ||
                    "Não informado";


                const bateria =
                    produto.bateria ||
                    "Não informado";


                const tela =
                    produto.tela ||
                    "Não informado";


                const carregamento =
                    produto.carregamento ||
                    "Não informado";


                return `

                <article class="produto">

                    <div class="produto-topo">

                        <div>

                            <h2>
                                ${index + 1}º —
                                ${produto.nome || "Dispositivo"}
                            </h2>

                            <div class="categoria">

                                ${produto.marca || ""}

                                •

                                ${produto.categoria || ""}

                            </div>

                        </div>


                        <div class="total">

                            💠
                            ${p.total.toLocaleString("pt-BR")}

                        </div>

                    </div>


                    <!-- PONTUAÇÃO -->

                    <div class="pontos-grid">

                        <div class="ponto">

                            <strong>
                                🧠 CPU
                            </strong>

                            <span>
                                ${p.CPU.toLocaleString("pt-BR")}
                            </span>

                        </div>


                        <div class="ponto">

                            <strong>
                                🎮 GPU
                            </strong>

                            <span>
                                ${p.GPU.toLocaleString("pt-BR")}
                            </span>

                        </div>


                        <div class="ponto">

                            <strong>
                                💾 MEM
                            </strong>

                            <span>
                                ${p.MEM.toLocaleString("pt-BR")}
                            </span>

                        </div>


                        <div class="ponto">

                            <strong>
                                📱 UX
                            </strong>

                            <span>
                                ${p.UX.toLocaleString("pt-BR")}
                            </span>

                        </div>

                    </div>


                    <!-- INFORMAÇÕES -->

                    <div class="info-extra">

                        <div class="info">

                            📸 <strong>Câmera</strong><br>

                            ${camera}

                        </div>


                        <div class="info">

                            🔋 <strong>Bateria</strong><br>

                            ${bateria}

                        </div>


                        <div class="info">

                            📱 <strong>Tela</strong><br>

                            ${tela}

                        </div>


                        <div class="info">

                            ⚡ <strong>Carregamento</strong><br>

                            ${carregamento}

                        </div>

                    </div>

                </article>

                `;

            }
        )
        .join("");

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        renderizar();

    }
);

</script>

</body>

</html>
