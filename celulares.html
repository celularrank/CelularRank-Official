<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Celulares | CelularRank-Official</title>

    <meta
        name="description"
        content="Compare celulares por preço, desempenho, jogos, câmera, bateria e custo-benefício."
    >

    <link rel="stylesheet" href="style.css">

    <style>

        /* ========================================
           📱 PÁGINA DE CELULARES
        ======================================== */

        .pagina {
            min-height: 100vh;
            padding: 45px 20px 70px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* CABEÇALHO */

        .pagina-topo {
            text-align: center;
            margin-bottom: 35px;
        }

        .pagina-topo h1 {
            font-size: clamp(34px, 6vw, 55px);
            margin-bottom: 12px;
        }

        .pagina-topo h1 span {
            color: #35a9ff;
        }

        .pagina-topo p {
            color: #b9c7dd;
            line-height: 1.6;
            max-width: 650px;
            margin: 0 auto;
        }

        /* VOLTAR */

        .voltar {
            display: inline-block;
            margin-bottom: 25px;

            color: #58b7ff;
            text-decoration: none;

            font-weight: bold;

            transition: 0.2s;
        }

        .voltar:hover {
            color: white;
        }

        /* CONTROLES */

        .controles {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 15px;
            margin-bottom: 30px;
        }

        .campo,
        .select {
            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.12);

            background: #0b2552;

            color: white;

            outline: none;

            font-size: 15px;
        }

        .campo::placeholder {
            color: #8294b2;
        }

        .campo:focus,
        .select:focus {
            border-color: #35a9ff;
        }

        .select option {
            background: #0b2552;
            color: white;
        }

        /* INFORMAÇÕES */

        .informacoes {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;

            color: #b9c7dd;
            font-size: 14px;
        }

        /* GRID */

        .produtos {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        /* CARD */

        .produto {
            background: #0b2552;

            border: 1px solid rgba(255,255,255,0.10);

            border-radius: 20px;

            padding: 22px;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .produto:hover {
            transform: translateY(-5px);

            border-color: #35a9ff;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.25);
        }

        /* MARCA */

        .marca {
            display: inline-block;

            padding: 6px 10px;

            background: rgba(53,169,255,0.12);

            color: #58b7ff;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 12px;
        }

        /* NOME */

        .produto h2 {
            font-size: 21px;

            margin-bottom: 10px;
        }

        /* PREÇO */

        .preco {
            font-size: 27px;

            font-weight: bold;

            color: #ffffff;

            margin-bottom: 18px;
        }

        /* NOTA */

        .nota {
            display: inline-flex;

            align-items: center;

            gap: 5px;

            background: #123a78;

            color: #ffffff;

            padding: 7px 10px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 18px;
        }

        /* ESPECIFICAÇÕES */

        .especificacoes {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-bottom: 20px;
        }

        .spec {
            background: rgba(255,255,255,0.04);

            border-radius: 10px;

            padding: 10px;
        }

        .spec small {
            display: block;

            color: #8294b2;

            font-size: 11px;

            margin-bottom: 4px;
        }

        .spec strong {
            font-size: 13px;

            color: #e5efff;
        }

        /* BARRAS */

        .avaliacoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .avaliacao {
            display: grid;

            grid-template-columns: 75px 1fr 30px;

            align-items: center;

            gap: 8px;

            font-size: 12px;

            color: #b9c7dd;
        }

        .barra {
            height: 7px;

            background: #061530;

            border-radius: 10px;

            overflow: hidden;
        }

        .barra div {
            height: 100%;

            background: #35a9ff;

            border-radius: 10px;
        }

        /* SEM RESULTADO */

        .sem-resultados {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

            background: #0b2552;

            border-radius: 20px;

            color: #b9c7dd;
        }

        .sem-resultados h2 {
            color: white;

            margin-bottom: 10px;
        }

        /* RESPONSIVO */

        @media (max-width: 900px) {

            .produtos {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .pagina {
                padding: 30px 15px 50px;
            }

            .controles {
                grid-template-columns: 1fr;
            }

            .produtos {
                grid-template-columns: 1fr;
            }

            .informacoes {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

        }

    </style>
</head>


<body>

    <!-- ========================================
         📱 PÁGINA
    ========================================= -->

    <main class="pagina">

        <div class="container">

            <!-- VOLTAR -->

            <a
                href="index.html"
                class="voltar"
            >
                ← Voltar para o início
            </a>


            <!-- CABEÇALHO -->

            <section class="pagina-topo">

                <div class="badge">
                    📱 CelularRank
                </div>

                <h1>
                    Ranking de
                    <span>Celulares</span>
                </h1>

                <p>
                    Compare celulares por preço,
                    desempenho, jogos, câmera,
                    bateria e qualidade.
                </p>

            </section>


            <!-- BUSCA E FILTRO -->

            <section class="controles">

                <input
                    type="search"
                    id="busca"
                    class="campo"
                    placeholder="🔎 Procurar celular ou marca..."
                    autocomplete="off"
                >

                <select
                    id="ordenacao"
                    class="select"
                >
                    <option value="ranking">
                        🏆 Melhor ranking
                    </option>

                    <option value="menor-preco">
                        💰 Menor preço
                    </option>

                    <option value="maior-preco">
                        💎 Maior preço
                    </option>

                    <option value="desempenho">
                        ⚡ Desempenho
                    </option>

                    <option value="jogos">
                        🎮 Jogos
                    </option>

                    <option value="bateria">
                        🔋 Bateria
                    </option>

                    <option value="camera">
                        📷 Câmera
                    </option>
                </select>

            </section>


            <!-- INFORMAÇÕES -->

            <div class="informacoes">

                <span id="contador">
                    Carregando celulares...
                </span>

                <span>
                    📊 Ranking CelularRank
                </span>

            </div>


            <!-- PRODUTOS -->

            <section
                id="listaCelulares"
                class="produtos"
            >
                <!-- Os celulares aparecem aqui -->
            </section>

        </div>

    </main>


    <!-- ========================================
         📦 DADOS
    ========================================= -->

    <script src="dados.js"></script>


    <!-- ========================================
         ⚙️ SCRIPT DA PÁGINA
    ========================================= -->

    <script>

        const lista = document.getElementById("listaCelulares");
        const busca = document.getElementById("busca");
        const ordenacao = document.getElementById("ordenacao");
        const contador = document.getElementById("contador");


        /* ========================================
           💰 PREÇO
        ======================================== */

        function precoBRL(valor) {

            return Number(valor).toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });

        }


        /* ========================================
           🔢 NOTA
        ======================================== */

        function notaProduto(produto) {

            if (typeof produto.nota === "number") {
                return produto.nota;
            }

            const notas = [];

            if (typeof produto.desempenho === "number")
                notas.push(produto.desempenho);

            if (typeof produto.jogos === "number")
                notas.push(produto.jogos);

            if (typeof produto.camera === "number")
                notas.push(produto.camera);

            if (typeof produto.bateria === "number")
                notas.push(produto.bateria);

            if (typeof produto.qualidade === "number")
                notas.push(produto.qualidade);

            if (notas.length === 0)
                return 0;

            const soma = notas.reduce(
                (total, nota) => total + nota,
                0
            );

            return Math.round(soma / notas.length);
        }


        /* ========================================
           📊 BARRA DE AVALIAÇÃO
        ======================================== */

        if (typeof celulares !== "undefined") {

    if (Array.isArray(celulares)) {
        filtrarProdutos();
    } else {
        mostrarErro("Os dados dos celulares não estão em formato válido.");
    }

} else {

    mostrarErro(
        O arquivo dados.js não foi carregado. Verifique o nome e o caminho do arquivo
    );

        }

        /* ========================================
           🃏 CARD
        ======================================== */

        function criarCard(produto, posicao) {

            const nota = notaProduto(produto);

            return `
                <article class="produto">

                    <span class="marca">
                        ${produto.marca || "Marca"}
                    </span>

                    <h2>
                        ${produto.nome}
                    </h2>

                    <div class="preco">
                        ${precoBRL(produto.preco)}
                    </div>

                    <div class="nota">
                        🏆 Nota ${nota}/100
                    </div>


                    <div class="especificacoes">

                        <div class="spec">
                            <small>Processador</small>
                            <strong>
                                ${produto.processador || "Não informado"}
                            </strong>
                        </div>

                        <div class="spec">
                            <small>RAM</small>
                            <strong>
                                ${produto.ram || "Não informado"}
                            </strong>
                        </div>

                        <div class="spec">
                            <small>Armazenamento</small>
                            <strong>
                                ${produto.armazenamento || "Não informado"}
                            </strong>
                        </div>

                        <div class="spec">
                            <small>Ranking</small>
                            <strong>
                                #${posicao}
                            </strong>
                        </div>

                    </div>


                    <div class="avaliacoes">

                        ${avaliacao(
                            "Desempenho",
                            produto.desempenho
                        )}

                        ${avaliacao(
                            "Jogos",
                            produto.jogos
                        )}

                        ${avaliacao(
                            "Câmera",
                            produto.camera
                        )}

                        ${avaliacao(
                            "Bateria",
                            produto.bateria
                        )}

                    </div>

                </article>
            `;
        }


        /* ========================================
           🔎 FILTRAR
        ======================================== */

        function filtrarProdutos() {

            const texto = busca.value
                .toLowerCase()
                .trim();


            let resultado = [...celulares];


            /* BUSCA */

            if (texto) {

                resultado = resultado.filter(produto => {

                    const nome =
                        String(produto.nome || "")
                            .toLowerCase();

                    const marca =
                        String(produto.marca || "")
                            .toLowerCase();

                    const processador =
                        String(produto.processador || "")
                            .toLowerCase();

                    return (
                        nome.includes(texto) ||
                        marca.includes(texto) ||
                        processador.includes(texto)
                    );

                });

            }


            /* ORDENAÇÃO */

            switch (ordenacao.value) {

                case "menor-preco":

                    resultado.sort(
                        (a, b) =>
                            Number(a.preco) -
                            Number(b.preco)
                    );

                    break;


                case "maior-preco":

                    resultado.sort(
                        (a, b) =>
                            Number(b.preco) -
                            Number(a.preco)
                    );

                    break;


                case "desempenho":

                    resultado.sort(
                        (a, b) =>
                            (b.desempenho || 0) -
                            (a.desempenho || 0)
                    );

                    break;


                case "jogos":

                    resultado.sort(
                        (a, b) =>
                            (b.jogos || 0) -
                            (a.jogos || 0)
                    );

                    break;


                case "bateria":

                    resultado.sort(
                        (a, b) =>
                            (b.bateria || 0) -
                            (a.bateria || 0)
                    );

                    break;


                case "camera":

                    resultado.sort(
                        (a, b) =>
                            (b.camera || 0) -
                            (a.camera || 0)
                    );

                    break;


                default:

                    resultado.sort(
                        (a, b) =>
                            notaProduto(b) -
                            notaProduto(a)
                    );

            }


            mostrarProdutos(resultado);

        }


        /* ========================================
           📱 MOSTRAR PRODUTOS
        ======================================== */

        function mostrarProdutos(produtos) {

            lista.innerHTML = "";


            contador.textContent =
                `${produtos.length} celular${produtos.length !== 1 ? "es" : ""} encontrado${produtos.length !== 1 ? "s" : ""}`;


            if (produtos.length === 0) {

                lista.innerHTML = `
                    <div class="sem-resultados">

                        <h2>
                            😕 Nenhum celular encontrado
                        </h2>

                        <p>
                            Tente pesquisar por outra marca
                            ou modelo.
                        </p>

                    </div>
                `;

                return;
            }


            produtos.forEach((produto, index) => {

                lista.innerHTML +=
                    criarCard(
                        produto,
                        index + 1
                    );

            });

        }


        /* ========================================
           🔄 EVENTOS
        ======================================== */

        busca.addEventListener(
            "input",
            filtrarProdutos
        );

        ordenacao.addEventListener(
            "change",
            filtrarProdutos
        );


        /* ========================================
           🚀 INICIAR
        ======================================== */

        if (
            typeof celulares !== "undefined" &&
            Array.isArray(celulares)
        ) {

            filtrarProdutos();

        } else {

            lista.innerHTML = `
                <div class="sem-resultados">

                    <h2>
                        ⚠️ Erro ao carregar os celulares
                    </h2>

                    <p>
                        Verifique se o arquivo
                        <strong>dados.js</strong>
                        está na mesma pasta.
                    </p>

                </div>
            `;

            contador.textContent =
                "Erro ao carregar dados.";

        }

    </script>

</body>

  </html>
<script src="./dados.js"></script>

<script>
    // código do celulares.html
</script>
