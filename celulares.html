<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Celulares | CelularRank-Official</title>

    <meta
        name="description"
        content="Compare celulares por preço, desempenho, jogos e qualidade."
    >

    <link rel="stylesheet" href="style.css">

    <style>

        .pagina {
            min-height: 100vh;
            padding: 45px 20px 70px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .pagina-topo {
            text-align: center;
            margin-bottom: 35px;
        }

        .pagina-topo h1 {
            font-size: clamp(34px, 6vw, 55px);
            margin-bottom: 12px;
        }

        .pagina-topo h1 span {
            color: #35a9ff;
        }

        .pagina-topo p {
            color: #b9c7dd;
            line-height: 1.6;
            max-width: 650px;
            margin: 0 auto;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 25px;
            color: #58b7ff;
            text-decoration: none;
            font-weight: bold;
        }

        .voltar:hover {
            color: white;
        }

        .controles {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 15px;
            margin-bottom: 30px;
        }

        .campo,
        .select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0b2552;
            color: white;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
        }

        .campo::placeholder {
            color: #8294b2;
        }

        .campo:focus,
        .select:focus {
            border-color: #35a9ff;
        }

        .select option {
            background: #0b2552;
            color: white;
        }

        .informacoes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: #b9c7dd;
            font-size: 14px;
        }

        .produtos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .produto {
            background: #0b2552;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 20px;
            padding: 22px;
            transition: 0.25s ease;
        }

        .produto:hover {
            transform: translateY(-5px);
            border-color: #35a9ff;
            box-shadow: 0 12px 35px rgba(0,0,0,0.25);
        }

        .marca {
            display: inline-block;
            padding: 6px 10px;
            background: rgba(53,169,255,0.12);
            color: #58b7ff;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .produto h2 {
            font-size: 21px;
            margin-bottom: 10px;
        }

        .preco {
            font-size: 27px;
            font-weight: bold;
            color: white;
            margin-bottom: 18px;
        }

        .nota {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: #123a78;
            color: white;
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .especificacoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .spec {
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            padding: 10px;
        }

        .spec small {
            display: block;
            color: #8294b2;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .spec strong {
            font-size: 13px;
            color: #e5efff;
        }

        .avaliacoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .avaliacao {
            display: grid;
            grid-template-columns: 85px 1fr 30px;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #b9c7dd;
        }

        .barra {
            height: 7px;
            background: #061530;
            border-radius: 10px;
            overflow: hidden;
        }

        .barra div {
            height: 100%;
            background: #35a9ff;
            border-radius: 10px;
        }

        .sem-resultados {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: #0b2552;
            border-radius: 20px;
            color: #b9c7dd;
        }

        .sem-resultados h2 {
            color: white;
            margin-bottom: 10px;
        }

        @media (max-width: 900px) {

            .produtos {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 650px) {

            .pagina {
                padding: 30px 15px 50px;
            }

            .controles {
                grid-template-columns: 1fr;
            }

            .produtos {
                grid-template-columns: 1fr;
            }

            .informacoes {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

        }

    </style>
</head>


<body>

<main class="pagina">

    <div class="container">

        <a href="index.html" class="voltar">
            ← Voltar para o início
        </a>

        <section class="pagina-topo">

            <div class="badge">
                📱 CelularRank
            </div>

            <h1>
                Ranking de
                <span>Celulares</span>
            </h1>

            <p>
                Compare celulares por preço,
                desempenho, jogos e qualidade.
            </p>

        </section>


        <section class="controles">

            <input
                type="search"
                id="busca"
                class="campo"
                placeholder="🔎 Procurar celular ou marca..."
                autocomplete="off"
            >

            <select id="ordenacao" class="select">

                <option value="ranking">
                    🏆 Melhor ranking
                </option>

                <option value="menor-preco">
                    💰 Menor preço
                </option>

                <option value="maior-preco">
                    💎 Maior preço
                </option>

                <option value="desempenho">
                    ⚡ Desempenho
                </option>

                <option value="jogos">
                    🎮 Jogos
                </option>

                <option value="qualidade">
                    ⭐ Qualidade
                </option>

            </select>

        </section>


        <div class="informacoes">

            <span id="contador">
                Carregando celulares...
            </span>

            <span>
                📊 Ranking CelularRank
            </span>

        </div>


        <section
            id="listaCelulares"
            class="produtos"
        ></section>

    </div>

</main>


<!-- =====================================================
     📦 CARREGAR DADOS
===================================================== -->

<script src="./dados.js"></script>


<!-- =====================================================
     ⚙️ SISTEMA DA PÁGINA
===================================================== -->

<script>

"use strict";


const lista =
    document.getElementById("listaCelulares");

const busca =
    document.getElementById("busca");

const ordenacao =
    document.getElementById("ordenacao");

const contador =
    document.getElementById("contador");


/* =====================================================
   💰 PREÇO
===================================================== */

function precoBRL(valor) {

    const numero = Number(valor);

    if (!Number.isFinite(numero) || numero <= 0) {
        return "Preço não informado";
    }

    return numero.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });

}


/* =====================================================
   🏆 NOTA
===================================================== */

function notaProduto(produto) {

    const notas = [
        Number(produto.desempenho) || 0,
        Number(produto.jogos) || 0,
        Number(produto.qualidade) || 0
    ];

    return Math.round(
        notas.reduce(
            (total, nota) => total + nota,
            0
        ) / notas.length
    );

}


/* =====================================================
   📊 BARRA
===================================================== */

function avaliacao(nome, valor) {

    const numero = Number(valor);

    if (!Number.isFinite(numero) || numero <= 0) {
        return "";
    }

    return `
        <div class="avaliacao">

            <span>${nome}</span>

            <div class="barra">
                <div style="width:${numero}%"></div>
            </div>

            <strong>${numero}</strong>

        </div>
    `;

}


/* =====================================================
   🃏 CRIAR CARD
===================================================== */

function criarCard(produto, posicao) {

    const nota = notaProduto(produto);

    return `

        <article class="produto">

            <span class="marca">
                ${produto.marca || "Marca"}
            </span>

            <h2>
                ${produto.nome || "Celular"}
            </h2>

            <div class="preco">
                ${precoBRL(produto.preco)}
            </div>

            <div class="nota">
                🏆 Nota ${nota}/100
            </div>


            <div class="especificacoes">

                <div class="spec">
                    <small>Processador</small>

                    <strong>
                        ${produto.processador || "Não informado"}
                    </strong>
                </div>


                <div class="spec">
                    <small>RAM</small>

                    <strong>
                        ${produto.ram || "Não informado"}
                    </strong>
                </div>


                <div class="spec">
                    <small>Armazenamento</small>

                    <strong>
                        ${produto.armazenamento || "Não informado"}
                    </strong>
                </div>


                <div class="spec">
                    <small>Ranking</small>

                    <strong>
                        #${posicao}
                    </strong>
                </div>

            </div>


            <div class="avaliacoes">

                ${avaliacao(
                    "Desempenho",
                    produto.desempenho
                )}

                ${avaliacao(
                    "Jogos",
                    produto.jogos
                )}

                ${avaliacao(
                    "Qualidade",
                    produto.qualidade
                )}

            </div>

        </article>

    `;

}


/* =====================================================
   🔎 FILTRAR
===================================================== */

function filtrarProdutos() {

    const texto =
        busca.value
            .toLowerCase()
            .trim();


    let resultado =
        Array.isArray(celulares)
            ? [...celulares]
            : [];


    /* BUSCA */

    if (texto) {

        resultado =
            resultado.filter(produto => {

                const nome =
                    String(produto.nome || "")
                        .toLowerCase();

                const marca =
                    String(produto.marca || "")
                        .toLowerCase();

                const processador =
                    String(produto.processador || "")
                        .toLowerCase();

                return (
                    nome.includes(texto) ||
                    marca.includes(texto) ||
                    processador.includes(texto)
                );

            });

    }


    /* ORDENAÇÃO */

    switch (ordenacao.value) {

        case "menor-preco":

            resultado.sort(
                (a, b) =>
                    Number(a.preco || 0) -
                    Number(b.preco || 0)
            );

            break;


        case "maior-preco":

            resultado.sort(
                (a, b) =>
                    Number(b.preco || 0) -
                    Number(a.preco || 0)
            );

            break;


        case "desempenho":

            resultado.sort(
                (a, b) =>
                    Number(b.desempenho || 0) -
                    Number(a.desempenho || 0)
            );

            break;


        case "jogos":

            resultado.sort(
                (a, b) =>
                    Number(b.jogos || 0) -
                    Number(a.jogos || 0)
            );

            break;


        case "qualidade":

            resultado.sort(
                (a, b) =>
                    Number(b.qualidade || 0) -
                    Number(a.qualidade || 0)
            );

            break;


        default:

            resultado.sort(
                (a, b) =>
                    notaProduto(b) -
                    notaProduto(a)
            );

    }


    mostrarProdutos(resultado);

}


/* =====================================================
   📱 MOSTRAR PRODUTOS
===================================================== */

function mostrarProdutos(produtos) {

    lista.innerHTML = "";


    contador.textContent =
        `${produtos.length} celular${produtos.length !== 1 ? "es" : ""} encontrado${produtos.length !== 1 ? "s" : ""}`;


    if (produtos.length === 0) {

        lista.innerHTML = `

            <div class="sem-resultados">

                <h2>
                    😕 Nenhum celular encontrado
                </h2>

                <p>
                    Tente pesquisar por outra marca
                    ou modelo.
                </p>

            </div>

        `;

        return;
    }


    produtos.forEach((produto, index) => {

        lista.innerHTML +=
            criarCard(
                produto,
                index + 1
            );

    });

}


/* =====================================================
   🔄 EVENTOS
===================================================== */

busca.addEventListener(
    "input",
    filtrarProdutos
);

ordenacao.addEventListener(
    "change",
    filtrarProdutos
);


/* =====================================================
   🚀 INICIAR
===================================================== */

if (
    typeof celulares !== "undefined" &&
    Array.isArray(celulares)
) {

    console.log(
        "📱 Celulares carregados:",
        celulares.length
    );

    filtrarProdutos();

} else {

    contador.textContent =
        "Erro ao carregar dados.";

    lista.innerHTML = `

        <div class="sem-resultados">

            <h2>
                ⚠️ Erro ao carregar os celulares
            </h2>

            <p>
                O arquivo <strong>dados.js</strong>
                não foi carregado corretamente.
            </p>

        </div>

    `;

}

</script>

</body>
</html> 
<script src="dados.js"></script>
<script src="script.js"></script>
