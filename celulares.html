<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Celulares - CelularRank</title>

    <meta
        name="description"
        content="Compare celulares no CelularRank por preço, marca, desempenho, jogos e especificações."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

    <div class="container header-content">

        <a href="index.html" class="logo">
            <span>CELULAR</span><strong>RANK</strong>
        </a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="main-nav" id="mainNav">
            <a href="index.html">Início</a>
            <a href="celulares.html" class="active">Celulares</a>
            <a href="pcs.html">PCs</a>
            <a href="pontos.html">Pontos</a>
        </nav>

    </div>

</header>


<main>

<section class="catalog-page">

<div class="container">

    <div class="page-head">

        <div>
            <span class="eyebrow">CATÁLOGO</span>

            <h1>Celulares</h1>

            <p>
                Pesquise, filtre e compare smartphones.
            </p>
        </div>

        <div class="catalog-count">
            <strong id="phoneCount">0</strong>
            <span>modelos</span>
        </div>

    </div>


    <section class="filter-panel">

        <div class="filter-row">

            <input
                id="phoneSearch"
                class="input"
                type="search"
                placeholder="🔎 Pesquisar celular..."
            >

            <select id="brandFilter" class="input">
                <option value="">Todas as marcas</option>
            </select>

            <select id="performanceFilter" class="input">

                <option value="">Qualquer desempenho</option>
                <option value="90">90+</option>
                <option value="80">80+</option>
                <option value="70">70+</option>
                <option value="60">60+</option>

            </select>

        </div>


        <div class="filter-row">

            <div class="range-box">

                <label>
                    Preço mínimo:
                    <strong id="minPriceLabel">R$ 0</strong>
                </label>

                <input
                    id="minPrice"
                    type="range"
                    min="0"
                    max="10000"
                    step="50"
                    value="0"
                >

            </div>


            <div class="range-box">

                <label>
                    Preço máximo:
                    <strong id="maxPriceLabel">R$ 10.000</strong>
                </label>

                <input
                    id="maxPrice"
                    type="range"
                    min="0"
                    max="10000"
                    step="50"
                    value="10000"
                >

            </div>

        </div>


        <div class="filter-actions">

            <button
                id="clearPhoneFilters"
                class="btn secondary"
            >
                Limpar filtros
            </button>

            <select id="phoneSort" class="input">

                <option value="relevancia">
                    Ordenar: Relevância
                </option>

                <option value="preco-menor">
                    Menor preço
                </option>

                <option value="preco-maior">
                    Maior preço
                </option>

                <option value="desempenho">
                    Maior desempenho
                </option>

                <option value="jogos">
                    Melhor para jogos
                </option>

            </select>

        </div>

    </section>


    <div class="compare-toolbar" id="phoneCompareToolbar">

        <span>
            📊 <strong id="phoneCompareCount">0</strong>
            selecionados
        </span>

        <button id="comparePhonesButton" class="btn primary">
            Comparar selecionados
        </button>

    </div>


    <div id="phoneGrid" class="product-grid"></div>

    <div id="phoneEmpty" class="empty" style="display:none;">
        <strong>Nenhum celular encontrado.</strong>
        <span>Tente alterar os filtros.</span>
    </div>

</div>

</section>

</main>


<div id="phoneCompareModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <div>
                <span class="eyebrow">COMPARAÇÃO</span>
                <h2>Celulares selecionados</h2>
            </div>

            <button id="closePhoneModal" class="close">
                ×
            </button>

        </div>

        <div id="phoneCompareContent"></div>

    </div>

</div>


<script src="dados.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const products = Array.isArray(window.celulares)
        ? window.celulares
        : [];

    const grid = document.getElementById("phoneGrid");
    const empty = document.getElementById("phoneEmpty");
    const count = document.getElementById("phoneCount");

    const search = document.getElementById("phoneSearch");
    const brand = document.getElementById("brandFilter");
    const performance = document.getElementById("performanceFilter");
    const minPrice = document.getElementById("minPrice");
    const maxPrice = document.getElementById("maxPrice");
    const minLabel = document.getElementById("minPriceLabel");
    const maxLabel = document.getElementById("maxPriceLabel");
    const sort = document.getElementById("phoneSort");

    const compareToolbar =
        document.getElementById("phoneCompareToolbar");

    const compareCount =
        document.getElementById("phoneCompareCount");

    const modal =
        document.getElementById("phoneCompareModal");

    const modalContent =
        document.getElementById("phoneCompareContent");

    let selected = [];

    count.textContent = products.length;


    function money(value) {

        if (
            value === null ||
            value === undefined ||
            value === "" ||
            Number(value) <= 0
        ) {
            return "Preço não informado";
        }

        return Number(value).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });
    }


    function score(value) {
        return Number(value || 0);
    }


    function createBrands() {

        const brands = [
            ...new Set(
                products
                    .map(item => item.marca)
                    .filter(Boolean)
            )
        ].sort();

        brands.forEach(item => {

            const option =
                document.createElement("option");

            option.value = item;
            option.textContent = item;

            brand.appendChild(option);

        });

    }


    function render() {

        const term =
            search.value.toLowerCase().trim();

        const selectedBrand =
            brand.value;

        const min =
            Number(minPrice.value);

        const max =
            Number(maxPrice.value);

        const minimumPerformance =
            Number(performance.value || 0);


        let result = products.filter(item => {

            const text = `
                ${item.nome || ""}
                ${item.marca || ""}
                ${item.processador || ""}
            `.toLowerCase();

            const matchesSearch =
                !term || text.includes(term);

            const matchesBrand =
                !selectedBrand ||
                item.marca === selectedBrand;

            const price =
                Number(item.preco || 0);

            const matchesPrice =
                !price ||
                (price >= min && price <= max);

            const matchesPerformance =
                score(item.desempenho) >= minimumPerformance;

            return (
                matchesSearch &&
                matchesBrand &&
                matchesPrice &&
                matchesPerformance
            );

        });


        if (sort.value === "preco-menor") {

            result.sort(
                (a, b) =>
                    Number(a.preco || 999999) -
                    Number(b.preco || 999999)
            );

        }


        if (sort.value === "preco-maior") {

            result.sort(
                (a, b) =>
                    Number(b.preco || 0) -
                    Number(a.preco || 0)
            );

        }


        if (sort.value === "desempenho") {

            result.sort(
                (a, b) =>
                    score(b.desempenho) -
                    score(a.desempenho)
            );

        }


        if (sort.value === "jogos") {

            result.sort(
                (a, b) =>
                    score(b.jogos) -
                    score(a.jogos)
            );

        }


        grid.innerHTML = "";

        result.forEach(item => {

            const card =
                document.createElement("article");

            card.className = "product-card";

            const isSelected =
                selected.includes(item.id);

            card.innerHTML = `

                <div class="product-top">

                    <span class="pill">
                        ${item.marca || "Marca"}
                    </span>

                    <label class="compare-check">

                        <input
                            type="checkbox"
                            data-compare="${item.id}"
                            ${isSelected ? "checked" : ""}
                        >

                        <span>Comparar</span>

                    </label>

                </div>

                <div class="product-icon">
                    📱
                </div>

                <h2>
                    ${item.nome || "Celular"}
                </h2>

                <p class="processor">
                    ${item.processador || "Processador não informado"}
                </p>

                <div class="price">
                    ${money(item.preco)}
                </div>

                <div class="score-row">

                    <div>
                        <span>Desempenho</span>
                        <strong>${score(item.desempenho)}</strong>
                    </div>

                    <div>
                        <span>Jogos</span>
                        <strong>${score(item.jogos)}</strong>
                    </div>

                    <div>
                        <span>Qualidade</span>
                        <strong>${score(item.qualidade)}</strong>
                    </div>

                </div>

                <div class="spec-grid">

                    <div>
                        <small>RAM</small>
                        <strong>${item.ram || "-"}</strong>
                    </div>

                    <div>
                        <small>Armazenamento</small>
                        <strong>${item.armazenamento || "-"}</strong>
                    </div>

                    <div>
                        <small>Bateria</small>
                        <strong>${item.bateria || "-"}</strong>
                    </div>

                    <div>
                        <small>Tela</small>
                        <strong>${item.tela || "-"}</strong>
                    </div>

                </div>

            `;

            grid.appendChild(card);

        });


        empty.style.display =
            result.length ? "none" : "flex";

        document.querySelectorAll(
            "[data-compare]"
        ).forEach(input => {

            input.addEventListener("change", () => {

                const id = input.dataset.compare;

                if (input.checked) {

                    if (selected.length >= 4) {

                        input.checked = false;

                        alert(
                            "Você pode comparar até 4 celulares."
                        );

                        return;
                    }

                    selected.push(id);

                } else {

                    selected =
                        selected.filter(
                            item => item !== id
                        );

                }

                updateCompare();

            });

        });

    }


    function updateCompare() {

        compareCount.textContent =
            selected.length;

        compareToolbar.classList.toggle(
            "show",
            selected.length > 0
        );

    }


    function openCompare() {

        if (selected.length < 2) {

            alert(
                "Selecione pelo menos 2 celulares."
            );

            return;
        }

        const items =
            selected
                .map(id =>
                    products.find(
                        item => String(item.id) === String(id)
                    )
                )
                .filter(Boolean);


        let html = `
            <div class="compare-wrap">
            <table class="compare-table">

                <tr>
                    <th>Especificação</th>
        `;

        items.forEach(item => {

            html += `
                <th>
                    ${item.nome}
                </th>
            `;

        });

        html += "</tr>";


        const rows = [

            ["Marca", "marca"],
            ["Processador", "processador"],
            ["RAM", "ram"],
            ["Armazenamento", "armazenamento"],
            ["Câmera", "camera"],
            ["Bateria", "bateria"],
            ["Tela", "tela"],
            ["Carregamento", "carregamento"],
            ["Desempenho", "desempenho"],
            ["Jogos", "jogos"],
            ["Qualidade", "qualidade"],
            ["Preço", "preco"]

        ];


        rows.forEach(([label, key]) => {

            html += `
                <tr>
                    <td class="compare-label">
                        ${label}
                    </td>
            `;

            items.forEach(item => {

                let value =
                    item[key] ?? "-";

                if (key === "preco") {
                    value = money(value);
                }

                html += `
                    <td>
                        ${value}
                    </td>
                `;

            });

            html += "</tr>";

        });


        html += `
            </table>
            </div>
        `;

        modalContent.innerHTML = html;

        modal.classList.add("open");

    }


    search.addEventListener("input", render);
    brand.addEventListener("change", render);
    performance.addEventListener("change", render);
    minPrice.addEventListener("input", () => {

        minLabel.textContent =
            money(minPrice.value);

        render();

    });

    maxPrice.addEventListener("input", () => {

        maxLabel.textContent =
            money(maxPrice.value);

        render();

    });

    sort.addEventListener("change", render);


    document
        .getElementById("clearPhoneFilters")
        .addEventListener("click", () => {

            search.value = "";
            brand.value = "";
            performance.value = "";
            minPrice.value = 0;
            maxPrice.value = 10000;
            sort.value = "relevancia";

            minLabel.textContent = "R$ 0";
            maxLabel.textContent = "R$ 10.000";

            render();

        });


    document
        .getElementById("comparePhonesButton")
        .addEventListener("click", openCompare);


    document
        .getElementById("closePhoneModal")
        .addEventListener("click", () => {

            modal.classList.remove("open");

        });


    modal.addEventListener("click", event => {

        if (event.target === modal) {
            modal.classList.remove("open");
        }

    });


    createBrands();
    render();

});

</script>

<script src="script.js"></script>

</body>
</html>
