<!-- ========================================
     📦 BANCO DE DADOS
========================================= -->

<script src="./dados.js"></script>


<!-- ========================================
     💻 SISTEMA DA PÁGINA
========================================= -->

<script>

"use strict";


const lista =
    document.getElementById("listaPCs");

const busca =
    document.getElementById("busca");

const ordenacao =
    document.getElementById("ordenacao");

const contador =
    document.getElementById("contador");


/* ========================================
   💰 PREÇO
======================================== */

function precoBRL(valor) {

    const numero = Number(valor);

    if (
        !Number.isFinite(numero) ||
        numero <= 0
    ) {
        return "Preço não informado";
    }

    return numero.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
    });

}


/* ========================================
   🏆 NOTA GERAL
======================================== */

function notaProduto(produto) {

    const desempenho =
        Number(produto.desempenho) || 0;

    const jogos =
        Number(produto.jogos) || 0;

    const trabalho =
        Number(produto.trabalho) || 0;

    const qualidade =
        Number(produto.qualidade) || 0;


    /*
       Como seus PCs atuais não possuem
       "trabalho", não deixamos esse 0
       diminuir a nota.
    */

    const notas = [
        desempenho,
        jogos,
        qualidade
    ];


    if (
        typeof produto.trabalho === "number"
    ) {
        notas.push(trabalho);
    }


    return Math.round(
        notas.reduce(
            (total, nota) => total + nota,
            0
        ) / notas.length
    );

}


/* ========================================
   📊 BARRA
======================================== */

function avaliacao(nome, valor) {

    const numero = Number(valor);

    if (
        !Number.isFinite(numero) ||
        numero <= 0
    ) {
        return "";
    }

    return `
        <div class="avaliacao">

            <span>${nome}</span>

            <div class="barra">
                <div style="width:${numero}%"></div>
            </div>

            <strong>${numero}</strong>

        </div>
    `;

}


/* ========================================
   🃏 CRIAR CARD
======================================== */

function criarCard(produto, posicao) {

    const nota =
        notaProduto(produto);


    return `

        <article class="produto">

            <span class="marca">
                ${produto.marca || "Marca"}
            </span>


            <h2>
                ${produto.nome || "PC sem nome"}
            </h2>


            <div class="preco">
                ${precoBRL(produto.preco)}
            </div>


            <div class="nota">
                🏆 Nota ${nota}/100
            </div>


            <div class="especificacoes">


                <div class="spec">

                    <small>
                        Processador
                    </small>

                    <strong>
                        ${produto.processador || "Não informado"}
                    </strong>

                </div>


                <div class="spec">

                    <small>
                        RAM
                    </small>

                    <strong>
                        ${produto.ram || "Não informado"}
                    </strong>

                </div>


                <div class="spec">

                    <small>
                        Armazenamento
                    </small>

                    <strong>
                        ${produto.armazenamento || "Não informado"}
                    </strong>

                </div>


                <div class="spec">

                    <small>
                        Vídeo
                    </small>

                    <strong>
                        ${produto.video || "Não informado"}
                    </strong>

                </div>


                <div class="spec">

                    <small>
                        Tipo
                    </small>

                    <strong>
                        ${produto.categoria || "PC"}
                    </strong>

                </div>


                <div class="spec">

                    <small>
                        Ranking
                    </small>

                    <strong>
                        #${posicao}
                    </strong>

                </div>


            </div>


            <div class="avaliacoes">

                ${avaliacao(
                    "Desempenho",
                    produto.desempenho
                )}

                ${avaliacao(
                    "Jogos",
                    produto.jogos
                )}

                ${avaliacao(
                    "Trabalho",
                    produto.trabalho
                )}

                ${avaliacao(
                    "Qualidade",
                    produto.qualidade
                )}

            </div>


        </article>

    `;

}


/* ========================================
   🔎 FILTRAR
======================================== */

function filtrarProdutos() {

    const texto =
        busca.value
            .toLowerCase()
            .trim();


    /*
       CORREÇÃO PRINCIPAL:

       Antes:
       window.pcs

       Agora:
       pcs

       Porque no dados.js está:
       const pcs = [...]
    */

    let resultado =
        Array.isArray(pcs)
            ? [...pcs]
            : [];


    /* BUSCA */

    if (texto) {

        resultado =
            resultado.filter(produto => {

                const nome =
                    String(
                        produto.nome || ""
                    ).toLowerCase();


                const marca =
                    String(
                        produto.marca || ""
                    ).toLowerCase();


                const processador =
                    String(
                        produto.processador || ""
                    ).toLowerCase();


                const categoria =
                    String(
                        produto.categoria || ""
                    ).toLowerCase();


                const video =
                    String(
                        produto.video || ""
                    ).toLowerCase();


                return (
                    nome.includes(texto) ||
                    marca.includes(texto) ||
                    processador.includes(texto) ||
                    categoria.includes(texto) ||
                    video.includes(texto)
                );

            });

    }


    /* ORDENAÇÃO */

    switch (ordenacao.value) {


        case "menor-preco":

            resultado.sort(
                (a, b) =>
                    Number(a.preco || Infinity) -
                    Number(b.preco || Infinity)
            );

            break;


        case "maior-preco":

            resultado.sort(
                (a, b) =>
                    Number(b.preco || 0) -
                    Number(a.preco || 0)
            );

            break;


        case "desempenho":

            resultado.sort(
                (a, b) =>
                    Number(b.desempenho || 0) -
                    Number(a.desempenho || 0)
            );

            break;


        case "jogos":

            resultado.sort(
                (a, b) =>
                    Number(b.jogos || 0) -
                    Number(a.jogos || 0)
            );

            break;


        case "trabalho":

            resultado.sort(
                (a, b) =>
                    Number(b.trabalho || 0) -
                    Number(a.trabalho || 0)
            );

            break;


        case "qualidade":

            resultado.sort(
                (a, b) =>
                    Number(b.qualidade || 0) -
                    Number(a.qualidade || 0)
            );

            break;


        default:

            resultado.sort(
                (a, b) =>
                    notaProduto(b) -
                    notaProduto(a)
            );

            break;

    }


    mostrarProdutos(resultado);

}


/* ========================================
   💻 MOSTRAR PCS
======================================== */

function mostrarProdutos(produtos) {

    lista.innerHTML = "";


    contador.textContent =
        `${produtos.length} produto${
            produtos.length !== 1
                ? "s"
                : ""
        } encontrado${
            produtos.length !== 1
                ? "s"
                : ""
        }`;


    if (produtos.length === 0) {

        lista.innerHTML = `

            <div class="sem-resultados">

                <h2>
                    😕 Nenhum PC encontrado
                </h2>

                <p>
                    Tente procurar por outra
                    marca, modelo ou processador.
                </p>

            </div>

        `;

        return;

    }


    produtos.forEach(
        (produto, index) => {

            lista.innerHTML +=
                criarCard(
                    produto,
                    index + 1
                );

        }
    );

}


/* ========================================
   🔄 EVENTOS
======================================== */

busca.addEventListener(
    "input",
    filtrarProdutos
);


ordenacao.addEventListener(
    "change",
    filtrarProdutos
);


/* ========================================
   🚀 INICIAR
======================================== */

if (
    typeof pcs !== "undefined" &&
    Array.isArray(pcs)
) {

    console.log(
        "💻 PCs carregados:",
        pcs.length
    );


    filtrarProdutos();


} else {

    contador.textContent =
        "Erro ao carregar dados.";


    lista.innerHTML = `

        <div class="sem-resultados">

            <h2>
                ⚠️ Erro ao carregar os PCs
            </h2>

            <p>
                O arquivo
                <strong>dados.js</strong>
                não foi carregado corretamente.
            </p>

            <p>
                Verifique se
                <strong>dados.js</strong>
                está na mesma pasta
                deste arquivo.
            </p>

        </div>

    `;

}

</script>

</body>

</html>
