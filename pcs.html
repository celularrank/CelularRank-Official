<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PCs - CelularRank</title>

    <meta
        name="description"
        content="Compare PCs gamer, computadores e notebooks no CelularRank."
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">

    <div class="container header-content">

        <a href="index.html" class="logo">
            <span>CELULAR</span><strong>RANK</strong>
        </a>

        <button class="menu-toggle" id="menuToggle">
            ☰
        </button>

        <nav class="main-nav" id="mainNav">
            <a href="index.html">Início</a>
            <a href="celulares.html">Celulares</a>
            <a href="pcs.html" class="active">PCs</a>
            <a href="pontos.html">Pontos</a>
        </nav>

    </div>

</header>


<main>

<section class="catalog-page">

<div class="container">

    <div class="page-head">

        <div>

            <span class="eyebrow">
                COMPUTADORES
            </span>

            <h1>
                PCs / Notebooks
            </h1>

            <p>
                Compare configurações, desempenho, jogos e preço.
            </p>

        </div>

        <div class="catalog-count">
            <strong id="pcCount">0</strong>
            <span>modelos</span>
        </div>

    </div>


    <section class="filter-panel">

        <div class="filter-row">

            <input
                id="pcSearch"
                class="input"
                type="search"
                placeholder="🔎 Pesquisar PC..."
            >

            <select id="pcBrand" class="input">

                <option value="">
                    Todas as marcas
                </option>

            </select>


            <select id="pcType" class="input">

                <option value="">
                    Todos os tipos
                </option>

                <option value="Gamer">
                    Gamer
                </option>

                <option value="Notebook">
                    Notebook
                </option>

                <option value="Trabalho">
                    Trabalho
                </option>

            </select>

        </div>


        <div class="filter-row">

            <div class="range-box">

                <label>
                    Preço mínimo:
                    <strong id="pcMinLabel">
                        R$ 0
                    </strong>
                </label>

                <input
                    id="pcMin"
                    type="range"
                    min="0"
                    max="15000"
                    step="100"
                    value="0"
                >

            </div>


            <div class="range-box">

                <label>
                    Preço máximo:
                    <strong id="pcMaxLabel">
                        R$ 15.000
                    </strong>
                </label>

                <input
                    id="pcMax"
                    type="range"
                    min="0"
                    max="15000"
                    step="100"
                    value="15000"
                >

            </div>

        </div>


        <div class="filter-actions">

            <button
                id="clearPcFilters"
                class="btn secondary"
            >
                Limpar filtros
            </button>

            <select id="pcSort" class="input">

                <option value="relevancia">
                    Ordenar: Relevância
                </option>

                <option value="preco-menor">
                    Menor preço
                </option>

                <option value="preco-maior">
                    Maior preço
                </option>

                <option value="desempenho">
                    Maior desempenho
                </option>

                <option value="jogos">
                    Melhor para jogos
                </option>

            </select>

        </div>

    </section>


    <div class="compare-toolbar" id="pcCompareToolbar">

        <span>
            🖥️ <strong id="pcCompareCount">0</strong>
            selecionados
        </span>

        <button id="comparePcButton" class="btn primary">
            Comparar selecionados
        </button>

    </div>


    <div id="pcGrid" class="product-grid"></div>

    <div id="pcEmpty" class="empty" style="display:none;">
        <strong>Nenhum PC encontrado.</strong>
        <span>Tente alterar os filtros.</span>
    </div>

</div>

</section>

</main>


<div id="pcModal" class="modal">

    <div class="modal-box">

        <div class="modal-head">

            <div>
                <span class="eyebrow">COMPARAÇÃO</span>
                <h2>PCs selecionados</h2>
            </div>

            <button id="closePcModal" class="close">
                ×
            </button>

        </div>

        <div id="pcCompareContent"></div>

    </div>

</div>


<script src="dados.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const products =
        Array.isArray(window.pcs)
            ? window.pcs
            : [];


    const grid =
        document.getElementById("pcGrid");

    const empty =
        document.getElementById("pcEmpty");

    const count =
        document.getElementById("pcCount");


    const search =
        document.getElementById("pcSearch");

    const brand =
        document.getElementById("pcBrand");

    const type =
        document.getElementById("pcType");

    const min =
        document.getElementById("pcMin");

    const max =
        document.getElementById("pcMax");

    const minLabel =
        document.getElementById("pcMinLabel");

    const maxLabel =
        document.getElementById("pcMaxLabel");

    const sort =
        document.getElementById("pcSort");


    let selected = [];


    count.textContent =
        products.length;


    function money(value) {

        if (
            value === null ||
            value === undefined ||
            Number(value) <= 0
        ) {
            return "Preço não informado";
        }

        return Number(value).toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );

    }


    function createBrands() {

        const brands = [
            ...new Set(
                products
                    .map(item => item.marca)
                    .filter(Boolean)
            )
        ].sort();


        brands.forEach(item => {

            const option =
                document.createElement("option");

            option.value = item;
            option.textContent = item;

            brand.appendChild(option);

        });

    }


    function render() {

        const term =
            search.value.toLowerCase().trim();

        const selectedBrand =
            brand.value;

        const selectedType =
            type.value;

        const minValue =
            Number(min.value);

        const maxValue =
            Number(max.value);


        let result = products.filter(item => {

            const text = `
                ${item.nome || ""}
                ${item.marca || ""}
                ${item.processador || ""}
                ${item.gpu || ""}
            `.toLowerCase();


            const matchesSearch =
                !term || text.includes(term);


            const matchesBrand =
                !selectedBrand ||
                item.marca === selectedBrand;


            const matchesType =
                !selectedType ||
                String(item.tipo || "")
                    .toLowerCase()
                    .includes(
                        selectedType.toLowerCase()
                    );


            const price =
                Number(item.preco || 0);


            const matchesPrice =
                !price ||
                (
                    price >= minValue &&
                    price <= maxValue
                );


            return (
                matchesSearch &&
                matchesBrand &&
                matchesType &&
                matchesPrice
            );

        });


        if (sort.value === "preco-menor") {

            result.sort(
                (a, b) =>
                    Number(a.preco || 999999) -
                    Number(b.preco || 999999)
            );

        }


        if (sort.value === "preco-maior") {

            result.sort(
                (a, b) =>
                    Number(b.preco || 0) -
                    Number(a.preco || 0)
            );

        }


        if (
            sort.value === "desempenho" ||
            sort.value === "jogos"
        ) {

            const key =
                sort.value === "jogos"
                    ? "jogos"
                    : "desempenho";

            result.sort(
                (a, b) =>
                    Number(b[key] || 0) -
                    Number(a[key] || 0)
            );

        }


        grid.innerHTML = "";


        result.forEach(item => {

            const card =
                document.createElement("article");

            card.className =
                "product-card pc-card";


            const isSelected =
                selected.includes(item.id);


            card.innerHTML = `

                <div class="product-top">

                    <span class="pill">
                        ${item.marca || "PC"}
                    </span>

                    <label class="compare-check">

                        <input
                            type="checkbox"
                            data-pc-compare="${item.id}"
                            ${isSelected ? "checked" : ""}
                        >

                        <span>Comparar</span>

                    </label>

                </div>

                <div class="product-icon">
                    🖥️
                </div>

                <h2>
                    ${item.nome || "PC"}
                </h2>

                <p class="processor">
                    ${item.processador || "-"}
                </p>

                <div class="gpu-text">
                    🎮 ${item.gpu || "GPU não informada"}
                </div>

                <div class="price">
                    ${money(item.preco)}
                </div>

                <div class="score-row">

                    <div>
                        <span>Desempenho</span>
                        <strong>${item.desempenho || 0}</strong>
                    </div>

                    <div>
                        <span>Jogos</span>
                        <strong>${item.jogos || 0}</strong>
                    </div>

                    <div>
                        <span>Qualidade</span>
                        <strong>${item.qualidade || 0}</strong>
                    </div>

                </div>

                <div class="spec-grid">

                    <div>
                        <small>RAM</small>
                        <strong>${item.ram || "-"}</strong>
                    </div>

                    <div>
                        <small>SSD</small>
                        <strong>${item.armazenamento || "-"}</strong>
                    </div>

                    <div>
                        <small>GPU</small>
                        <strong>${item.gpu || "-"}</strong>
                    </div>

                    <div>
                        <small>Tipo</small>
                        <strong>${item.tipo || "-"}</strong>
                    </div>

                </div>

            `;


            grid.appendChild(card);

        });


        empty.style.display =
            result.length ? "none" : "flex";


        document.querySelectorAll(
            "[data-pc-compare]"
        ).forEach(input => {

            input.addEventListener("change", () => {

                const id =
                    input.dataset.pcCompare;


                if (input.checked) {

                    if (selected.length >= 4) {

                        input.checked = false;

                        alert(
                            "Você pode comparar até 4 PCs."
                        );

                        return;

                    }

                    selected.push(id);

                } else {

                    selected =
                        selected.filter(
                            item => item !== id
                        );

                }


                updateCompare();

            });

        });

    }


    function updateCompare() {

        document.getElementById(
            "pcCompareCount"
        ).textContent = selected.length;


        document.getElementById(
            "pcCompareToolbar"
        ).classList.toggle(
            "show",
            selected.length > 0
        );

    }


    function compare() {

        if (selected.length < 2) {

            alert(
                "Selecione pelo menos 2 PCs."
            );

            return;

        }


        const items =
            selected
                .map(id =>
                    products.find(
                        item =>
                            String(item.id) === String(id)
                    )
                )
                .filter(Boolean);


        let html = `
            <div class="compare-wrap">

            <table class="compare-table">

            <tr>
                <th>Especificação</th>
        `;


        items.forEach(item => {

            html += `
                <th>${item.nome}</th>
            `;

        });


        html += "</tr>";


        const rows = [

            ["Marca", "marca"],
            ["Tipo", "tipo"],
            ["Processador", "processador"],
            ["GPU", "gpu"],
            ["RAM", "ram"],
            ["Armazenamento", "armazenamento"],
            ["Desempenho", "desempenho"],
            ["Jogos", "jogos"],
            ["Qualidade", "qualidade"],
            ["Preço", "preco"]

        ];


        rows.forEach(([label, key]) => {

            html += `
                <tr>
                    <td class="compare-label">
                        ${label}
                    </td>
            `;


            items.forEach(item => {

                let value =
                    item[key] ?? "-";


                if (key === "preco") {
                    value = money(value);
                }


                html += `
                    <td>${value}</td>
                `;

            });


            html += "</tr>";

        });


        html += `
            </table>
            </div>
        `;


        document.getElementById(
            "pcCompareContent"
        ).innerHTML = html;


        document.getElementById(
            "pcModal"
        ).classList.add("open");

    }


    search.addEventListener("input", render);
    brand.addEventListener("change", render);
    type.addEventListener("change", render);
    sort.addEventListener("change", render);


    min.addEventListener("input", () => {

        minLabel.textContent =
            money(min.value);

        render();

    });


    max.addEventListener("input", () => {

        maxLabel.textContent =
            money(max.value);

        render();

    });


    document.getElementById(
        "clearPcFilters"
    ).addEventListener("click", () => {

        search.value = "";
        brand.value = "";
        type.value = "";

        min.value = 0;
        max.value = 15000;

        minLabel.textContent = "R$ 0";
        maxLabel.textContent = "R$ 15.000";

        sort.value = "relevancia";

        render();

    });


    document.getElementById(
        "comparePcButton"
    ).addEventListener(
        "click",
        compare
    );


    document.getElementById(
        "closePcModal"
    ).addEventListener(
        "click",
        () => {
            document
                .getElementById("pcModal")
                .classList.remove("open");
        }
    );


    document.getElementById(
        "pcModal"
    ).addEventListener(
        "click",
        event => {

            if (
                event.target.id === "pcModal"
            ) {
                event.target.classList.remove("open");
            }

        }
    );


    createBrands();
    render();

});

</script>

<script src="script.js"></script>

</body>
</html>
