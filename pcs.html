<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PCs | CelularRank-Official</title>

    <meta
        name="description"
        content="Ranking e comparação de PCs e notebooks do CelularRank-Official."
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .pagina {

            min-height: 100vh;

            padding:
                45px
                20px
                70px;

        }


        .container {

            width: 100%;

            max-width: 1200px;

            margin: 0 auto;

        }


        .voltar {

            display: inline-block;

            margin-bottom: 25px;

            color: #58b7ff;

            text-decoration: none;

            font-weight: bold;

        }


        .pagina-topo {

            text-align: center;

            margin-bottom: 35px;

        }


        .pagina-topo h1 {

            font-size:
                clamp(
                    34px,
                    6vw,
                    55px
                );

            margin-bottom: 12px;

        }


        .pagina-topo h1 span {

            color: #35a9ff;

        }


        .pagina-topo p {

            color: #b9c7dd;

            line-height: 1.6;

            max-width: 750px;

            margin: 0 auto;

        }


        /* CONTROLES */

        .controles {

            display: grid;

            grid-template-columns:
                1fr
                220px;

            gap: 15px;

            margin-bottom: 30px;

        }


        .campo,
        .select {

            width: 100%;

            padding: 14px 16px;

            border-radius: 12px;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.12
                );

            background: #0b2552;

            color: white;

            outline: none;

            font-size: 15px;

        }


        .campo::placeholder {

            color: #8294b2;

        }


        .campo:focus,
        .select:focus {

            border-color:
                #35a9ff;

        }


        .select option {

            background: #0b2552;

            color: white;

        }


        /* INFORMAÇÕES */

        .informacoes {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;

            color: #b9c7dd;

            font-size: 14px;

        }


        /* PRODUTOS */

        .produtos {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 20px;

        }


        /* CARD */

        .produto {

            background: #0b2552;

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.10
                );

            border-radius: 20px;

            padding: 22px;

            transition:
                0.25s ease;

        }


        .produto:hover {

            transform:
                translateY(-5px);

            border-color:
                #35a9ff;

        }


        .marca {

            display: inline-block;

            padding:
                6px
                10px;

            background:
                rgba(
                    53,
                    169,
                    255,
                    0.12
                );

            color: #58b7ff;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .produto h2 {

            font-size: 21px;

            margin-bottom: 8px;

        }


        .categoria {

            color: #8294b2;

            font-size: 13px;

            margin-bottom: 12px;

        }


        .preco {

            font-size: 27px;

            font-weight: bold;

            margin-bottom: 18px;

        }


        /* ESPECIFICAÇÕES */

        .especificacoes {

            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 9px;

        }


        .spec {

            background: #071a3d;

            border-radius: 10px;

            padding: 11px;

            color: #b9c7dd;

            font-size: 12px;

            line-height: 1.4;

        }


        .spec strong {

            display: block;

            color: white;

            margin-bottom: 4px;

        }


        /* DESEMPENHO */

        .desempenho {

            margin-top: 15px;

            padding-top: 15px;

            border-top:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.08
                );

        }


        .desempenho-titulo {

            display: flex;

            justify-content:
                space-between;

            margin-bottom: 7px;

            font-size: 13px;

            color: #b9c7dd;

        }


        .barra {

            width: 100%;

            height: 8px;

            background: #071a3d;

            border-radius: 10px;

            overflow: hidden;

        }


        .barra span {

            display: block;

            height: 100%;

            background: #35a9ff;

            border-radius: 10px;

        }


        .vazio {

            text-align: center;

            padding: 40px;

            color: #b9c7dd;

            grid-column: 1 / -1;

        }


        /* MOBILE */

        @media (max-width: 850px) {

            .produtos {

                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );

            }

        }


        @media (max-width: 650px) {

            .controles {

                grid-template-columns:
                    1fr;

            }


            .produtos {

                grid-template-columns:
                    1fr;

            }


            .informacoes {

                flex-direction: column;

                align-items: flex-start;

                gap: 8px;

            }

        }

    </style>

</head>


<body>


<main class="pagina">

<div class="container">


<a
    href="index.html"
    class="voltar"
>
    ← Voltar
</a>


<section class="pagina-topo">

    <h1>
        💻 <span>PCs</span>
    </h1>

    <p>
        Encontre PCs e notebooks,
        compare desempenho, jogos,
        processador, memória e armazenamento.
    </p>

</section>


<section class="controles">

    <input
        id="busca"
        class="campo"
        type="text"
        placeholder="🔎 Pesquisar PC ou notebook..."
        autocomplete="off"
    >


    <select
        id="ordenacao"
        class="select"
    >

        <option value="ranking">
            Melhor desempenho
        </option>

        <option value="preco-menor">
            Menor preço
        </option>

        <option value="preco-maior">
            Maior preço
        </option>

        <option value="jogos">
            Melhor para jogos
        </option>

        <option value="qualidade">
            Melhor qualidade
        </option>

    </select>

</section>


<div class="informacoes">

    <span id="contador">
        Carregando PCs...
    </span>

</div>


<section
    id="produtos"
    class="produtos"
>

    <div class="vazio">
        Carregando PCs...
    </div>

</section>


</div>

</main>


<!-- DADOS -->

<script src="./dados.js?v=20260913"></script>


<script>

/* =====================================================
   CELULARRANK — PÁGINA DE PCS
===================================================== */


const produtosContainer =
    document.getElementById(
        "produtos"
    );


const busca =
    document.getElementById(
        "busca"
    );


const ordenacao =
    document.getElementById(
        "ordenacao"
    );


const contador =
    document.getElementById(
        "contador"
    );


let listaPCs = [];


/* =====================================================
   CARREGAR PCS
===================================================== */

function carregarPCs() {

    if (
        typeof window.pcs === "undefined" ||
        !Array.isArray(window.pcs)
    ) {

        produtosContainer.innerHTML = `

            <div class="vazio">

                ❌ Não foi possível carregar os PCs.

                <br><br>

                Verifique o arquivo
                <strong>dados.js</strong>.

            </div>

        `;

        contador.textContent =
            "Erro ao carregar PCs.";

        return;

    }


    listaPCs =
        [...window.pcs];


    renderizar();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   PREÇO
===================================================== */

function formatarPreco(valor) {

    const numero =
        Number(valor);


    if (
        !Number.isFinite(numero) ||
        numero <= 0
    ) {

        return "Preço não informado";

    }


    return numero.toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizar() {

    let produtos =
        [...listaPCs];


    const termo =
        busca.value
            .toLowerCase()
            .trim()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            );


    /* PESQUISA */

    if (termo) {

        produtos =
            produtos.filter(
                pc => {

                    const texto = [

                        pc.nome,
                        pc.marca,
                        pc.categoria,
                        pc.processador,
                        pc.video,
                        pc.ram,
                        pc.armazenamento

                    ]
                    .join(" ")
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(
                        /[\u0300-\u036f]/g,
                        ""
                    );


                    return texto.includes(
                        termo
                    );

                }
            );

    }


    /* ORDENAÇÃO */

    switch (
        ordenacao.value
    ) {

        case "preco-menor":

            produtos.sort(
                (a, b) =>
                    Number(a.preco || 0) -
                    Number(b.preco || 0)
            );

            break;


        case "preco-maior":

            produtos.sort(
                (a, b) =>
                    Number(b.preco || 0) -
                    Number(a.preco || 0)
            );

            break;


        case "jogos":

            produtos.sort(
                (a, b) =>
                    Number(b.jogos || 0) -
                    Number(a.jogos || 0)
            );

            break;


        case "qualidade":

            produtos.sort(
                (a, b) =>
                    Number(b.qualidade || 0) -
                    Number(a.qualidade || 0)
            );

            break;


        default:

            produtos.sort(
                (a, b) => {

                    const notaA =
                        (
                            Number(a.desempenho || 0) +
                            Number(a.jogos || 0) +
                            Number(a.qualidade || 0)
                        ) / 3;


                    const notaB =
                        (
                            Number(b.desempenho || 0) +
                            Number(b.jogos || 0) +
                            Number(b.qualidade || 0)
                        ) / 3;


                    return notaB - notaA;

                }
            );

    }


    contador.textContent =
        `${produtos.length} PC${produtos.length !== 1 ? "s" : ""} encontrado${produtos.length !== 1 ? "s" : ""}.`;


    /* VAZIO */

    if (!produtos.length) {

        produtosContainer.innerHTML = `

            <div class="vazio">

                Nenhum PC encontrado.

            </div>

        `;

        return;

    }


    /* CARDS */

    produtosContainer.innerHTML =
        produtos.map(
            (pc, index) => {

                const desempenho =
                    Number(
                        pc.desempenho || 0
                    );


                return `

                <article class="produto">

                    <span class="marca">

                        ${escaparHTML(
                            pc.marca || "Marca"
                        )}

                    </span>


                    <h2>

                        ${escaparHTML(
                            pc.nome || "PC"
                        )}

                    </h2>


                    <div class="categoria">

                        ${escaparHTML(
                            pc.categoria || "PC"
                        )}

                    </div>


                    <div class="preco">

                        ${formatarPreco(
                            pc.preco
                        )}

                    </div>


                    <div class="especificacoes">

                        <div class="spec">

                            <strong>
                                ⚙️ Processador
                            </strong>

                            ${escaparHTML(
                                pc.processador ||
                                "Não informado"
                            )}

                        </div>


                        <div class="spec">

                            <strong>
                                💾 RAM
                            </strong>

                            ${escaparHTML(
                                pc.ram ||
                                "Não informado"
                            )}

                        </div>


                        <div class="spec">

                            <strong>
                                💿 Armazenamento
                            </strong>

                            ${escaparHTML(
                                pc.armazenamento ||
                                "Não informado"
                            )}

                        </div>


                        <div class="spec">

                            <strong>
                                🎮 Vídeo
                            </strong>

                            ${escaparHTML(
                                pc.video ||
                                "Não informado"
                            )}

                        </div>

                    </div>


                    <div class="desempenho">

                        <div class="desempenho-titulo">

                            <span>
                                🏆 Desempenho
                            </span>

                            <strong>
                                ${desempenho}/100
                            </strong>

                        </div>


                        <div class="barra">

                            <span
                                style="
                                    width:${Math.max(
                                        0,
                                        Math.min(
                                            100,
                                            desempenho
                                        )
                                    )}%;
                                "
                            ></span>

                        </div>

                    </div>

                </article>

                `;

            }
        )
        .join("");

}


/* =====================================================
   EVENTOS
===================================================== */

busca.addEventListener(
    "input",
    renderizar
);


ordenacao.addEventListener(
    "change",
    renderizar
);


/* =====================================================
   INICIAR
===================================================== */

carregarPCs();

</script>


</body>

</html>
